<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Logan M. Dixon</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #102a43; color: #edf4f7; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 680px; }
    p:first-child { color: #6ed3d8; font-size: .8rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .2rem 0 1rem; font-family: Georgia, serif; font-size: clamp(3rem, 10vw, 6rem); font-weight: 500; letter-spacing: -.05em; }
    p { color: #c7d8df; font-size: 1.08rem; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1rem; border: 1px solid #6ed3d8; border-radius: 8px; color: #edf4f7; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p>Error 404</p>
    <h1>Page not found.</h1>
    <p>The address may have changed, or the page may belong to a separate project site.</p>
    <a href="/">Return to lmdixon23.github.io</a>
    <a href="/privacy.html">Privacy</a>
  </main>

<!-- AI Playgrounds aggregate analytics: canonical host only; no cookies; no third-party script; DNT/GPC and opt-out respected. -->
<script>
(function () {
  'use strict';
  var CANONICAL_HOST = 'lmdixon23.github.io';
  var ENDPOINT = 'https://lmdixon23.goatcounter.com/count';
  var PAGE_KIND = "portfolio";
  var PAGE_SLUG = "portfolio-404";
  var SOURCE_ALLOWLIST = new Set(['hn','linkedin','csta','sigcse','oercommons','merlot','reddit','bluesky','mastodon','devto','hashnode','github','email','school','portfolio','resume','zenodo','jose']);
  var liveImages = [];

  function storageGet(storage, key) { try { return storage.getItem(key); } catch (_) { return null; } }
  function storageSet(storage, key, value) { try { storage.setItem(key, value); } catch (_) {} }
  function privacySignal() {
    return navigator.globalPrivacyControl === true || navigator.doNotTrack === '1' ||
      navigator.doNotTrack === 'yes' || window.doNotTrack === '1';
  }
  function clean(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9._/-]+/g, '-').replace(/-+/g, '-').slice(0, 80);
  }

  var params = new URLSearchParams(location.search);
  var optedOut = params.get('analytics') === 'off' || storageGet(localStorage, 'ai-playgrounds-analytics') === 'off';
  var enabled = location.hostname === CANONICAL_HOST && !privacySignal() && !optedOut;

  function send(path) {
    if (!enabled) return;
    var img = new Image(1, 1);
    img.referrerPolicy = 'no-referrer';
    img.onload = img.onerror = function () {
      var i = liveImages.indexOf(img);
      if (i >= 0) liveImages.splice(i, 1);
    };
    img.src = ENDPOINT + '?p=' + encodeURIComponent(path);
    liveImages.push(img);
  }

  window.aiPlaygroundsAnalytics = {
    enabled: enabled,
    optOut: function () { storageSet(localStorage, 'ai-playgrounds-analytics', 'off'); location.reload(); },
    optIn: function () { storageSet(localStorage, 'ai-playgrounds-analytics', 'on'); location.reload(); },
    count: function (path) { send('/event/' + clean(path)); }
  };

  document.addEventListener('click', function (event) {
    var out = event.target.closest('#analytics-opt-out');
    var inn = event.target.closest('#analytics-opt-in');
    if (out) { event.preventDefault(); window.aiPlaygroundsAnalytics.optOut(); return; }
    if (inn) { event.preventDefault(); window.aiPlaygroundsAnalytics.optIn(); return; }
    if (!enabled) return;

    var link = event.target.closest('a[href]');
    if (link) {
      var href = link.getAttribute('href') || '';
      var app = href.match(/playgrounds\/([^/?#]+)\/?/i);
      if (app) send('/event/launch/' + clean(app[1]));
      else if (/\.(pdf|zip|md|docx?|pptx?|csv)(?:[?#]|$)/i.test(href)) send('/event/resource/' + clean((href.split('/').pop() || 'download').split(/[?#]/)[0]));
      else if (/github\.com\/lmdixon23\/ai-playgrounds/i.test(href)) send('/event/outbound/github');
    }

    if (PAGE_KIND === 'applet') {
      var control = event.target.closest('main button, main [role="button"], .workspace button, .controls button');
      if (control && !control.closest('header, nav, footer, .toolbar')) {
        var key = 'ai-playgrounds-engaged-' + PAGE_SLUG;
        if (storageGet(sessionStorage, key) !== '1') {
          storageSet(sessionStorage, key, '1');
          send('/event/engaged/' + clean(PAGE_SLUG));
        }
      }
    }
  }, true);

  if (!enabled) return;
  send(location.pathname || '/ai-playgrounds/');
  var source = clean(params.get('ap_src'));
  if (SOURCE_ALLOWLIST.has(source)) send('/event/campaign/' + source);
})();
</script>

</body>
</html>
